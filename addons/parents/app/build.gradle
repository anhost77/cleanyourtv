plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.maison.parents'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.maison.parents'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Document-start scripts and Client Hints metadata, so sites see a Windows PC (BrowserActivity).
    implementation 'androidx.webkit:webkit:1.12.1'
}
